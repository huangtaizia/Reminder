<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #3aa8ff;
  --accent-rgb: 58, 168, 255;
  --bar-duration: 60s;
  --bar-delay: 0s;
  --card-w: 600px;
  --card-top: #1a1e2e;
  --card-mid: #13151c;
}

html, body { height: 100%; width: 100%; overflow: hidden; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "DM Sans", "Segoe UI Variable", system-ui, -apple-system, sans-serif;
  color: #e8eeff;
  background: transparent;
  -webkit-font-smoothing: antialiased;
}

/* Dim */
.root {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  animation: fadeIn 200ms 16ms ease-out forwards;
  will-change: opacity;
}
.root::before {
  content: ''; position: fixed; inset: 0;
  background: rgba(0,0,0,.72);
  pointer-events: none;
}

/* ── CARD ── */
.card {
  position: relative;
  width: var(--card-w);
  border-radius: 22px;
  padding: 36px 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  isolation: isolate;

  background-image:
    /* accent tint nhẹ ở chính giữa, fade nhanh — không đổ về góc */
    radial-gradient(
      ellipse 60% 50% at 50% 50%,
      rgba(var(--accent-rgb),.11) 0%,
      transparent 100%
    ),
    /* nền dark đồng đều — 4 góc cùng màu, không bị tối hơn */
    linear-gradient(180deg, var(--card-top) 0%, var(--card-top) 100%);

  /*
    Viền 2 lớp để nổi bật trên nền dim:
    - Lớp ngoài: rgba(.22) — đủ sáng để thấy rõ cạnh card
    - Lớp trong (inset): rgba(.08) highlight trắng mỏng — glass effect
    Không dùng màu đặc tránh trông cứng
  */
  /* Dùng box-shadow ring thay border để đồng đều độ dày ở góc bo.
     border thông thường bị antialiasing làm mỏng hơn ở góc cong.
     box-shadow spread=0 không bị ảnh hưởng bởi border-radius. */
  border: 1px solid rgba(var(--accent-rgb),.30);
  box-shadow:

    /* inner top highlight — glass edge */
    0 1px 0 rgba(255,255,255,.11) inset,
    /* inner bottom depth */
    0 -1px 0 rgba(0,0,0,.30) inset,
    /* sát card — soft lift */
    0 2px 8px rgba(0,0,0,.45),
    /* mid elevation */
    0 12px 40px rgba(0,0,0,.65),
    /* deep shadow — tách card khỏi nền */
    0 40px 90px rgba(0,0,0,.75),
    /* accent ambient — halo màu nhẹ */
    0 0 100px -16px rgba(var(--accent-rgb),.28);

  transform: scale(.116);
  animation: cardIn 200ms 16ms cubic-bezier(.34, 1.3, .64, 1) forwards;
  will-change: transform;
}

/* Top accent glow line — sáng hơn để thấy rõ cạnh trên */
.card::before {
  content: '';
  position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg,
    transparent,
    rgba(var(--accent-rgb),.45) 35%,
    rgba(var(--accent-rgb),.45) 65%,
    transparent
  );
  border-radius: 999px;
}


/* CLOSE */
.close {
  position: absolute; top: 12px; right: 12px;
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,.30); cursor: pointer;
  transition: color .15s, background .15s;
}
.close:hover { color: rgba(255,255,255,.70); background: rgba(255,255,255,.08); }
.close:active { transform: scale(.90); }

/* ── ICON ── */
.iconSection {
  position: relative;
  width: 110px; height: 110px;
  display: flex; align-items: center; justify-content: center;
  margin-top: 0;
}
.blob { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform; }
.blob1 {
  inset: -32px;
  background: radial-gradient(circle, rgba(var(--accent-rgb),.20) 0%, rgba(var(--accent-rgb),.06) 45%, transparent 70%);
  filter: blur(14px);
  animation: breathOuter 3s ease-in-out infinite;
}
.blob2 {
  inset: -16px;
  background: radial-gradient(circle, rgba(var(--accent-rgb),.34) 0%, rgba(var(--accent-rgb),.11) 50%, transparent 72%);
  filter: blur(8px);
  animation: breathMid 3s ease-in-out infinite .2s;
}
.blob3 {
  inset: 0;
  background: radial-gradient(circle, rgba(var(--accent-rgb),.52) 0%, rgba(var(--accent-rgb),.11) 45%, transparent 70%);
  filter: blur(5px);
  animation: breathInner 3s ease-in-out infinite .4s;
}
.iconWrap {
  position: relative;
  width: 74px; height: 74px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(var(--accent-rgb),.14), rgba(var(--accent-rgb),.04));
  border: 1px solid rgba(var(--accent-rgb),.20);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05) inset,
    0 4px 20px rgba(0,0,0,.45),
    0 0 20px -10px rgba(var(--accent-rgb),.20);
  z-index: 1;
}
.icon {
  font-size: 34px;
  filter: drop-shadow(0 2px 6px rgba(var(--accent-rgb),.45));
}

/* ── MESSAGE ── */
.msg {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.025em;
  line-height: 1.35;
  width: 100%;
  color: var(--accent);
}
.line {
  white-space: normal;
  word-break: break-word;
}

/* DIVIDER */
.divider {
  width: 75%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.12) 30%,
    rgba(255,255,255,.12) 70%,
    transparent 100%
  );
  animation: dividerOpen .5s .22s ease-out both;
  transform-origin: center;
}

/* ── FOOTER ── */
.footer {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.timeRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.time {
  font-family: "DM Mono", monospace;
  font-size: 13px; font-weight: 500;
  color: rgba(200,215,255,.40);
  letter-spacing: .06em;
  display: flex; align-items: center; gap: 6px;
}
.time::before {
  content: '';
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
  opacity: .11;
  animation: blink 2s ease-in-out infinite;
  flex-shrink: 0;
}

.countdown {
  font-family: "DM Mono", monospace;
  font-size: 13px; font-weight: 500;
  color: rgba(var(--accent-rgb),.55);
  letter-spacing: .05em;
}
.countdown.urgent { color: #ff6060; animation: urgentPulse .6s ease-in-out infinite; }

.progressBar {
  width: 100%; height: 6px; border-radius: 999px;
  background: rgba(255,255,255,.08);
  position: relative;
  overflow: hidden;
}
.bar {
  position: absolute; top: 0; left: 0;
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg,
    rgba(var(--accent-rgb),.90) 0%,
    rgba(var(--accent-rgb),.45) 100%
  );
  animation: barShrink var(--bar-duration) var(--bar-delay) linear forwards;
  will-change: width;
}

/* HINT */
.hint {
  font-size: 12px;
  color: rgba(200,215,255,.11);
  letter-spacing: .02em;
  text-align: center;
  margin-top: -4px;
}

/* ── KEYFRAMES ── */
@keyframes fadeIn { to { opacity: 1; } }

@keyframes cardIn {
  from { opacity: 0; transform: scale(.116); }
  to   { opacity: 1; transform: scale(1);   }
}

@keyframes barShrink {
  from { width: 100%; }
  to   { width: 0%; }
}

@keyframes dividerOpen {
  from { clip-path: inset(0 50% 0 50%); }
  to   { clip-path: inset(0 0% 0 0%); }
}
@keyframes breathOuter {
  0%,100% { transform: scale(.112); opacity: .50; }
  50%     { transform: scale(1.20); opacity: 1;  }
}
@keyframes breathMid {
  0%,100% { transform: scale(.115); opacity: .55; }
  50%     { transform: scale(1.16); opacity: 1;  }
}
@keyframes breathInner {
  0%,100% { transform: scale(.90); opacity: .62; }
  50%     { transform: scale(1.12); opacity: 1;  }
}
@keyframes blink {
  0%,100% { opacity: .11; }
  50%     { opacity: .25; }
}
@keyframes urgentPulse {
  0%,100% { opacity: 1; }
  50%     { opacity: .3; }
}
</style>
</head>

<body>
<div class="root">
  <div class="card">
    <div class="close" id="closeBtn">✕</div>

    <div class="iconSection">
      <div class="blob blob1"></div>
      <div class="blob blob2"></div>
      <div class="blob blob3"></div>
      <div class="iconWrap">
        <div class="icon" id="icon">⏰</div>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="divider"></div>

    <div class="footer">
      <div class="timeRow">
        <div class="time" id="clock"></div>
        <div class="countdown" id="countdownNum">--:--</div>
      </div>
      <div class="progressBar">
        <div class="bar" id="bar"></div>
      </div>
    </div>

    <div class="hint">Esc hoặc ✕ để đóng</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search)
const CFG = JSON.parse(decodeURIComponent(params.get("cfg") || "{}"))
CFG.displayMs = CFG.displayMs || 60000
CFG.startAt   = CFG.startAt   || Date.now()

const accentHex = (CFG.color || "#3aa8ff").replace("#","")
document.documentElement.style.setProperty("--accent", CFG.color || "#3aa8ff")
const r = parseInt(accentHex.slice(0,2),16)
const g = parseInt(accentHex.slice(2,4),16)
const b = parseInt(accentHex.slice(4,6),16)
document.documentElement.style.setProperty("--accent-rgb", `${r},${g},${b}`)

const blend = (c, base, ratio) => Math.round(c * ratio + base * (1 - ratio))
const topR = blend(r, 10, .11), topG = blend(g, 11, .11), topB = blend(b, 16, .11)
const midR = blend(r, 10, .11), midG = blend(g, 11, .11), midB = blend(b, 16, .11)
const toHex = n => n.toString(16).padStart(2,'0')
document.documentElement.style.setProperty("--card-top", `#${toHex(topR)}${toHex(topG)}${toHex(topB)}`)
document.documentElement.style.setProperty("--card-mid", `#${toHex(midR)}${toHex(midG)}${toHex(midB)}`)

document.getElementById("icon").innerText = CFG.icon || "⏰"

const msg = document.getElementById("msg")
if (CFG.line2) {
  msg.innerHTML = '<div class="line">'+(CFG.line1 || 'Thông điệp nhắc nhở')+'</div><div class="line">'+CFG.line2+'</div>'
} else {
  msg.innerHTML = '<div class="line">'+(CFG.line1 || 'Thông điệp nhắc nhở')+'</div>'
}

function closePopup() { window.close() }
document.getElementById("closeBtn").onclick = closePopup
window.addEventListener("keydown", e => { if (e.key==="Escape") closePopup() })

const clockEl     = document.getElementById("clock")
const countdownEl = document.getElementById("countdownNum")

function fmtClock() {
  const d = new Date()
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
}
function fmtCountdown(ms) {
  if (ms <= 0) return "00:00"
  const s = Math.ceil(ms / 1000)
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')
}

requestAnimationFrame(() => {
  const elapsed = Date.now() - CFG.startAt
  const remain  = CFG.displayMs - elapsed
  if (remain <= 0) { closePopup(); return }

  document.documentElement.style.setProperty("--bar-duration", (CFG.displayMs/1000).toFixed(4)+"s")
  document.documentElement.style.setProperty("--bar-delay",    "-"+(elapsed/1000).toFixed(4)+"s")

  clockEl.textContent     = fmtClock()
  countdownEl.textContent = fmtCountdown(remain)

  const timer = setInterval(() => {
    const r = CFG.displayMs - (Date.now() - CFG.startAt)
    if (r <= 0) { clearInterval(timer); closePopup(); return }
    countdownEl.textContent = fmtCountdown(r)
    clockEl.textContent     = fmtClock()
    if (r <= 10000) countdownEl.classList.add("urgent")
    else            countdownEl.classList.remove("urgent")
  }, 1000)
})
</script>
</body>
</html>
