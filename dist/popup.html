<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:    #4D8EFF;
  --accent2:   #ADC6FF;
  --bar-duration: 60s;
  --bar-delay:    0s;
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  color: #DAE2FD;
  -webkit-font-smoothing: antialiased;
}

/* ── FADE IN ── */
.root {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  animation: fadeIn 180ms 16ms ease-out forwards;
  background: transparent;
}

/* ── CARD ── */
.card {
  position: relative;
  width: calc(100vw - 32px);
  max-width: 480px;
  min-width: 300px;
  border-radius: 18px;
  background: #131B2E;
  border: 1px solid rgba(173,198,255,0.14);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.6),
    0 32px 80px rgba(0,0,0,0.55),
    0 0 0 1px rgba(255,255,255,0.05) inset;
  overflow: hidden;
  transform: scale(0.92) translateY(8px);
  animation: cardIn 220ms 16ms cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
  will-change: transform, opacity;
}

/* ── CARD BODY ── */
.cardBody {
  padding: 24px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── CLOSE ── */
.close {
  position: absolute; top: 14px; right: 14px;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  color: rgba(173,198,255,0.35);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.close:hover { color: rgba(173,198,255,0.8); background: rgba(255,255,255,0.06); }

/* ── HEADER ROW: icon + label ── */
.headerRow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.headerIcon {
  color: var(--accent2);
  display: flex; align-items: center;
  flex-shrink: 0;
  width: 20px; height: 20px;
  justify-content: center;
}
.headerIcon svg { max-width: 20px; max-height: 20px; }
.headerLabel {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(173,198,255,0.55);
}

/* ── MESSAGE ── */
.msg {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.35;
  color: #DAE2FD;
  letter-spacing: -0.01em;
  margin-bottom: 24px;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
  width: 100%;
}

/* ── BOTTOM ROW: time + buttons ── */
.bottomRow {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

/* Time section */
.timeSection { flex: 1; }
.timeLabel {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(173,198,255,0.4);
  margin-bottom: 4px;
}
.timeValue {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.timeClock {
  font-size: 32px;
  font-weight: 300;
  color: rgba(218,226,253,0.85);
  letter-spacing: -0.02em;
  line-height: 1;
}
.timeZone {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(173,198,255,0.4);
  text-transform: uppercase;
}

/* Hint */
.hint {
  font-size: 12px;
  color: rgba(173,198,255,0.2);
  letter-spacing: 0.04em;
  align-self: flex-end;
  padding-bottom: 2px;
  flex-shrink: 0;
}

/* ── PROGRESS BAR — đáy card ── */
.progressBar {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
}
.bar {
  position: absolute; top: 0; left: 0;
  height: 100%;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(90deg, #ADC6FF 0%, #4D8EFF 100%);
  animation: barShrink var(--bar-duration) var(--bar-delay) linear forwards;
  will-change: width;
}

/* ── COUNTDOWN (hidden, bên cạnh time) ── */
.countdown {
  font-size: 11px;
  font-weight: 600;
  color: rgba(173,198,255,0.35);
  letter-spacing: 0.06em;
  margin-top: 2px;
}
.countdown.urgent { color: #ff6060; animation: urgentPulse 0.6s ease-in-out infinite; }

/* ── KEYFRAMES ── */
@keyframes fadeIn {
  to { opacity: 1; }
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.92) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes barShrink {
  from { width: 100%; }
  to   { width: 0%; }
}
@keyframes urgentPulse {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.3; }
}
</style>
</head>

<body>
<div class="root">
  <div class="card">
    <div class="cardBody">

      <div class="close" id="closeBtn">✕</div>

      <!-- Header: icon + label -->
      <div class="headerRow">
        <div class="headerIcon" id="headerIcon">
          <svg width="12" height="14" viewBox="0 0 12 20" fill="currentColor">
            <path d="M6.5 0L0 11H5.5V20L12 9H6.5V0Z"/>
          </svg>
        </div>
        <div class="headerLabel" id="headerLabel">Incoming Sync</div>
      </div>

      <!-- Message -->
      <div class="msg" id="msg">Thông điệp nhắc nhở</div>

      <!-- Bottom: time + hint -->
      <div class="bottomRow">
        <div class="timeSection">
          <div class="timeLabel">Thời gian hiện tại</div>
          <div class="timeValue">
            <div class="timeClock" id="clock">00:00</div>
          </div>
          <div class="countdown" id="countdown">--:--</div>
        </div>
        <div class="hint">Esc hoặc ✕ để đóng</div>
      </div>

    </div>

    <!-- Progress bar sát đáy -->
    <div class="progressBar">
      <div class="bar" id="bar"></div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search)
const CFG = JSON.parse(decodeURIComponent(params.get("cfg") || "{}"))
CFG.displayMs = CFG.displayMs || 60000
CFG.startAt   = CFG.startAt   || Date.now()

// Dịch chuyển card theo stack offset khi nhiều popup chồng nhau
if (CFG.stackOffset) {
  const card = document.querySelector('.card')
  if (card) card.style.transform = 'translate(' + CFG.stackOffset + 'px, ' + (-CFG.stackOffset) + 'px)'
}

// Message
const msgEl = document.getElementById("msg")
msgEl.textContent = CFG.message || CFG.line1 || 'Thông điệp nhắc nhở'

// SVG icons map — đồng bộ với reminderIcons / reminderEditor
const ICONS = {
  water:    { label: 'Uống nước', svg: '<svg width="20" height="20" viewBox="0 0 16 20" fill="currentColor"><path d="M8 0L1 8C1 12.42 4.13 16 8 16C11.87 16 15 12.42 15 8L8 0ZM8 14.5C5 14.5 2.5 11.84 2.5 8.5L8 2.1L13.5 8.5C13.5 11.84 11 14.5 8 14.5Z"/><path d="M4.5 9.5C4.5 11.43 6.07 13 8 13V11.5C6.9 11.5 6 10.6 6 9.5H4.5Z"/></svg>' },
  run:      { label: 'Vận động',  svg: '<svg width="20" height="20" viewBox="0 0 90 82" fill="currentColor"><path d="M42.918 50.129c-1.144 0-2.277-.497-3.054-1.454-1.367-1.685-1.108-4.159.577-5.526l22.419-18.18c1.685-1.364 4.159-1.108 5.526.577 1.366 1.686 1.108 4.159-.577 5.526L45.39 49.251c-.728.591-1.603.878-2.472.878z"/><path d="M71.946 43.083c-1.343 0-2.648-.69-3.381-1.924l-6.608-11.133c-1.108-1.865-.493-4.276 1.372-5.383 1.866-1.107 4.277-.492 5.383 1.373l4.664 7.857 10.793-5.967c1.9-1.05 4.289-.361 5.339 1.537 1.049 1.899.362 4.289-1.537 5.339l-14.128 7.81c-.605.333-1.257.491-1.897.491z"/><path d="M38.608 34.788c-1.203 0-2.391-.551-3.161-1.593-1.29-1.744-.922-4.204.822-5.494l11.837-8.758c1.092-.808 2.525-.995 3.787-.492l14.893 5.92c2.016.801 3.001 3.085 2.199 5.102-.801 2.017-3.086 3-5.101 2.2l-12.862-5.112-10.08 7.458c-.703.569-1.522.769-2.334.769z"/><circle cx="76.622" cy="19.962" r="6.782"/><path d="M20.115 74.459c-1.237 0-2.455-.582-3.219-1.673-1.246-1.776-.816-4.226.96-5.472l15.626-10.962 5.916-11.901c.966-1.943 3.325-2.733 5.266-1.77 1.943.966 2.735 3.324 1.77 5.266l-6.36 12.795c-.292.587-.726 1.091-1.262 1.467L22.368 73.746c-.687.482-1.474.713-2.253.713z"/><path d="M57.856 56.365c-.504 0-1.017-.098-1.511-.304l-14.943-6.235c-2.002-.835-2.948-3.136-2.112-5.138.836-2.002 3.137-2.946 5.138-2.112L59.37 48.81c2.003.835 2.948 3.136 2.113 5.138-.629 1.507-2.089 2.417-3.627 2.417z"/><path d="M50.014 76.82c-.467 0-.943-.083-1.405-.261-2.026-.777-3.039-3.049-2.262-5.075l7.842-20.456c.777-2.026 3.048-3.04 5.075-2.263s3.038 3.049 2.263 5.075l-7.843 20.456c-.629 1.564-2.119 2.524-3.67 2.524z"/><path d="M31.603 45.981H1.964C.879 45.981 0 45.102 0 44.017c0-1.085.879-1.964 1.964-1.964h29.639c1.085 0 1.964.879 1.964 1.964 0 1.085-.88 1.964-1.964 1.964z"/><path d="M27.581 35.524H9.204c-1.085 0-1.964-.879-1.964-1.964s.879-1.964 1.964-1.964h18.377c1.085 0 1.964.879 1.964 1.964s-.879 1.964-1.964 1.964z"/><path d="M25.168 56.438H9.204c-1.085 0-1.964-.879-1.964-1.964s.879-1.964 1.964-1.964h15.964c1.085 0 1.964.879 1.964 1.964s-.879 1.964-1.964 1.964z"/></svg>' },
  email:    { label: 'Gửi email', svg: '<svg width="20" height="20" viewBox="0 0 20 16" fill="currentColor"><path d="M18 0H2C0.9 0 0 0.9 0 2V14C0 15.1 0.9 16 2 16H18C19.1 16 20 15.1 20 14V2C20 0.9 19.1 0 18 0ZM18 4L10 9L2 4V2L10 7L18 2V4Z"/></svg>' },
  coffee:   { label: 'Uống cafe', svg: '<svg width="20" height="20" viewBox="0 0 18 18" fill="currentColor"><path d="M14 6H2V12C2 13.66 3.34 15 5 15H11C12.66 15 14 13.66 14 12V11H15C16.1 11 17 10.1 17 9C17 7.9 16.1 7 15 7H14V6ZM15 9H14V8H15C15.55 8 16 8.45 16 9C16 9.55 15.55 10 15 10V9ZM3 12V7H13V12C13 13.1 12.1 14 11 14H5C3.9 14 3 13.1 3 12Z"/></svg>' },
  rest:     { label: 'Nghỉ ngơi', svg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
  charge:   { label: 'Nhắc khéo', svg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 10h2v2H7zm0-4h2v2H7zm0 8h2v2H7zm4-8h10v2H11zm0 4h10v2H11zm0 4h8v2H11z"/></svg>' },
  eyes:     { label: 'Nghỉ mắt',  svg: '<svg width="20" height="20" viewBox="0 0 20 14" fill="currentColor"><path d="M10 0C5.45 0 1.57 2.93 0 7C1.57 11.07 5.45 14 10 14C14.55 14 18.43 11.07 20 7C18.43 2.93 14.55 0 10 0ZM10 11.5C7.52 11.5 5.5 9.48 5.5 7C5.5 4.52 7.52 2.5 10 2.5C12.48 2.5 14.5 4.52 14.5 7C14.5 9.48 12.48 11.5 10 11.5ZM10 4.5C8.62 4.5 7.5 5.62 7.5 7C7.5 8.38 8.62 9.5 10 9.5C11.38 9.5 12.5 8.38 12.5 7C12.5 5.62 11.38 4.5 10 4.5Z"/></svg>' },
  food:     { label: 'Ăn uống',   svg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>' },
  stretch:  { label: 'Giải trí',  svg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15 7.5V2H9v5.5l3 3 3-3zM7.5 9H2v6h5.5l3-3-3-3zM9 16.5V22h6v-5.5l-3-3-3 3zM16.5 9l-3 3 3 3H22V9h-5.5z"/></svg>' },
  bike:     { label: 'Đạp xe',    svg: '<svg width="20" height="20" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4" cy="12" r="3"/><circle cx="16" cy="12" r="3"/><circle cx="13" cy="3" r="1.5" fill="currentColor" stroke="none"/><path d="M7 4H11L14 9H8L7 4Z"/><path d="M8 9L4 12"/><path d="M14 9L16 12"/><path d="M11 3L14 9"/></svg>' },
  meditate: { label: 'Thiền',     svg: '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="3" r="2"/><path d="M10 6C10 6 7 7 5 9C7 9 9 9.5 10 11C11 9.5 13 9 15 9C13 7 10 6 10 6Z"/><path d="M3 12C3 12 5 11 7 12L10 15L13 12C15 11 17 12 17 12C17 12 14 13 13 15L10 19L7 15C6 13 3 12 3 12Z"/></svg>' },
  folder:   { label: 'Tài liệu',  svg: '<svg width="20" height="20" viewBox="0 0 20 18" fill="currentColor"><path d="M18 4H10L8 2H2C0.9 2 0 2.9 0 4V14C0 15.1 0.9 16 2 16H18C19.1 16 20 15.1 20 14V6C20 4.9 19.1 4 18 4ZM18 14H2V4H7.17L9.17 6H18V14Z"/></svg>' },
}

const iconData = CFG.icon && ICONS[CFG.icon] ? ICONS[CFG.icon] : null

// Render icon SVG vào headerIcon
const headerIconEl = document.getElementById("headerIcon")
if (iconData) {
  headerIconEl.innerHTML = iconData.svg
} // else giữ icon ⚡ mặc định

// Header label
const headerLabelEl = document.getElementById("headerLabel")
if (iconData) {
  headerLabelEl.textContent = iconData.label
}

// Close
function closePopup() { window.close() }
document.getElementById("closeBtn").onclick = closePopup
window.addEventListener("keydown", e => { if (e.key === "Escape") closePopup() })

// Clock + countdown
const clockEl    = document.getElementById("clock")
const countdownEl = document.getElementById("countdown")

function fmtClock() {
  const d = new Date()
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0')
}
function fmtCountdown(ms) {
  if (ms <= 0) return "00:00"
  const s = Math.ceil(ms / 1000)
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0')
}

// Progress bar timing
requestAnimationFrame(() => {
  const elapsed = Date.now() - CFG.startAt
  const remain  = CFG.displayMs - elapsed
  if (remain <= 0) { closePopup(); return }

  document.documentElement.style.setProperty("--bar-duration", (CFG.displayMs / 1000).toFixed(4) + "s")
  document.documentElement.style.setProperty("--bar-delay",    "-" + (elapsed / 1000).toFixed(4) + "s")

  clockEl.textContent    = fmtClock()
  countdownEl.textContent = fmtCountdown(remain)

  const timer = setInterval(() => {
    const r = CFG.displayMs - (Date.now() - CFG.startAt)
    if (r <= 0) { clearInterval(timer); closePopup(); return }
    countdownEl.textContent = fmtCountdown(r)
    clockEl.textContent     = fmtClock()
    if (r <= 10000) countdownEl.classList.add("urgent")
    else            countdownEl.classList.remove("urgent")
  }, 1000)
})
</script>
</body>
</html>
